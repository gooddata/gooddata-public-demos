# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: top_products

title: Top Products
description: Ranks products by net sales (revenue) when sliced by product. Higher rank corresponds to higher revenue. Supports identification of top products by sales, best-selling products by revenue, and revenue-based product ranking.

maql: "Select rank({metric/revenue_by_product}) DESC "
format: "#,##0.00"
