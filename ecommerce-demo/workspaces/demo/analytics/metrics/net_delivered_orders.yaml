# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: net_delivered_orders

title: Net Delivered Orders
description: Calculates the net number of orders by subtracting the number of canceled orders from the number of processed orders

maql: SELECT (select {metric/number_of_orders}WHERE {label/order_status} = "Processed") - (select {metric/number_of_orders} WHERE {label/order_status} = "Canceled")
format: "#,##0.00"
