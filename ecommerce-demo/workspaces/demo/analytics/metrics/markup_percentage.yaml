# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: markup_percentage

title: Markup Percentage
description: Measures the percentage increase of the selling price over the product's cost, indicating how much profit margin is added on top of the cost.

maql: select ((AVG({fact/order_unit_price})-Avg({fact/order_unit_cost}))/avg({fact/order_unit_cost}))
format: "#,##0.00%"
