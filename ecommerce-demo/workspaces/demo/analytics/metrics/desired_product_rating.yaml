type: metric
id: desired_product_rating

title: Desired Product Rating
description: Constant target product rating value set to 4. Serves as a benchmark when comparing actual product ratings to a goal and supports analysis of desired rating or target rating versus actual performance.

maql: Select 4
format: "#,##0"
