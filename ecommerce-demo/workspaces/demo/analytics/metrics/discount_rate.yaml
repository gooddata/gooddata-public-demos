# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: discount_rate

title: Discount Rate
description: Measures the percentage reduction applied to the original selling price of products or services, reflecting promotional strategies or negotiated pricing.

maql: select({metric/total_discounts}/({metric/total_sales}) )
format: "#,##0.00%"
