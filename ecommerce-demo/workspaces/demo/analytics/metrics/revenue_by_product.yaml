# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: revenue_by_product

title: Revenue by Product
description: Net sales (revenue) attributed to each product when the result is sliced by product. Serves as the basis for ranking products by revenue, showing revenue by product, and for the top products metric.

maql: |
  SELECT SUM({metric/net_sales}) BY {label/product_id}
format: "#,##0.00"
