# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: customers_with_multiple_orders

title: Customers with Multiple Orders
description: Count of distinct customers who have placed more than one order in the context period. Supports identification of repeat buyers, analysis of customers with multiple orders, and segmentation of repeat or loyal customers.

maql: |
  SELECT COUNT({label/customer_id})
  WHERE (
      SELECT COUNT({label/order_id})
      BY {label/customer_id}
  ) > 1
format: "#,##0"
