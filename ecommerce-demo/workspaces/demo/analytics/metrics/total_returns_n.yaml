# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: total_returns_n

title: Total Returns (Negative)
description: Measures total refunds as a negative value so it can be combined with sales in net revenue calculations; represents refunds issued for returned items and supports analysis of sales performance and customer satisfaction.

maql: SELECT -1 * {metric/total_returns}
format: $#,##0.00
