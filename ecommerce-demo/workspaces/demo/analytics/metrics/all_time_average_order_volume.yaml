# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: all_time_average_order_volume

title: Order Volume per Order (All Time)
description: Measures the average quantity of items or units purchased per order across all time (ignoring date filters), providing a baseline for comparing period-specific order volume and customer purchasing behavior.

maql: SELECT {metric/net_sales} / {metric/number_of_orders} BY ALL IN ALL OTHER DIMENSIONS
format: "#,##0.00"
