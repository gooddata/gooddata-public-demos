# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: net_sales_goal

title: Net Sales Goal
description: Measures the target revenue by increasing last period's net sales by 10%, guiding sales performance towards growth.

maql: SELECT (SELECT {metric/net_sales} FOR PreviousPeriod({label/date.day})) * 1.1
format: |-
  [>=1000000000000]$#,,,,.0 T;
  [>=1000000000]$#,,,.0 B;
  [>=1000000]$#,,.0 M;
  [>=1000]$#,.0 K;
  [>=0]$#,##0;
  [<=-1000000000000]-$#,,,,.0 T;
  [<=-1000000000]-$#,,,.0 B;
  [<=-1000000]-$#,,.0 M;
  [<=-1000]-$#,.0 K;
  [<0]-$#,##0
