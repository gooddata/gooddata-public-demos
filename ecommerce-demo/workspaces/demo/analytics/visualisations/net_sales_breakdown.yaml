# A visualization is a visual representation of a user's analytical view of the data.
# You build visualizations from metrics, attributes, and optionally filters that are combined in a way to visualize a particular aspect of your data.
# The visualizations are executed over and over as fresh data gets loaded.
# Interpreting the content of a visualization is up to the user (the consumer of the visualization).
# Read more about visualisations:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-visualizations/concepts/visualization/

type: waterfall_chart
id: net_sales_breakdown

title: Net Sales Breakdown
description: Shows the impact of discounts and returns on total revenue, helping assess true sales performance after adjustments.

query:
  fields:
    2a97814eeab147098977d7897b0c9a17: metric/total_sales
    65e5344addea4da7963af25a96ead8b1:
      title: Total Discounts
      using: metric/total_discounts_n
    4651549e7602441f90085a108f464f26:
      title: Total Returns
      using: metric/total_returns_n

metrics:
  - 2a97814eeab147098977d7897b0c9a17
  - field: 65e5344addea4da7963af25a96ead8b1
    format: |-
      [>=1000000000000]$#,,,,.0 T;
      [>=1000000000]$#,,,.0 B;
      [>=1000000]$#,,.0 M;
      [>=1000]$#,.0 K;
      [>=0]$#,##0;
      [<=-1000000000000]-$#,,,,.0 T;
      [<=-1000000000]-$#,,,.0 B;
      [<=-1000000]-$#,,.0 M;
      [<=-1000]-$#,.0 K;
      [<0]-$#,##0
  - field: 4651549e7602441f90085a108f464f26
    format: |-
      [>=1000000000000]$#,,,,.0 T;
      [>=1000000000]$#,,,.0 B;
      [>=1000000]$#,,.0 M;
      [>=1000]$#,.0 K;
      [>=0]$#,##0;
      [<=-1000000000000]-$#,,,,.0 T;
      [<=-1000000000]-$#,,,.0 B;
      [<=-1000000]-$#,,.0 M;
      [<=-1000]-$#,.0 K;
      [<0]-$#,##0

config:
  total_name: Total
  xaxis_rotation: "0"
