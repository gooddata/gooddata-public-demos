# A visualization is a visual representation of a user's analytical view of the data.
# You build visualizations from metrics, attributes, and optionally filters that are combined in a way to visualize a particular aspect of your data.
# The visualizations are executed over and over as fresh data gets loaded.
# Interpreting the content of a visualization is up to the user (the consumer of the visualization).
# Read more about visualisations:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-visualizations/concepts/visualization/

type: headline_chart
id: sales_conversion_rate

title: Sales Conversion Rate (%)
description: Headline that displays the ratio of orders to active customers for the current quarter and the previous quarter. Represents the share of active customers who placed at least one order. Supports analysis of sales conversion rate, conversion percentage, and orders per customer for period comparison.

query:
  fields:
    af090190f4334a768fc217e9c17023fc: metric/sales_conversion_rate
    af090190f4334a768fc217e9c17023fc_previous_period:
      title: Previous period
      type: PREVIOUS_PERIOD
      date_filter: date
      using: af090190f4334a768fc217e9c17023fc

  filter_by:
    date_quarter:
      type: date_filter
      granularity: QUARTER
      from: -1
      to: -1
      using: date

metrics:
  - af090190f4334a768fc217e9c17023fc
  - af090190f4334a768fc217e9c17023fc_previous_period

config:
  indicator_arrow: true
  label_conditional: true
