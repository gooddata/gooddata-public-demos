# A visualization is a visual representation of a user's analytical view of the data.
# You build visualizations from metrics, attributes, and optionally filters that are combined in a way to visualize a particular aspect of your data.
# The visualizations are executed over and over as fresh data gets loaded.
# Interpreting the content of a visualization is up to the user (the consumer of the visualization).
# Read more about visualisations:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-visualizations/concepts/visualization/

type: headline_chart
id: gross_profit_headline

title: Gross Profit
description: Displays the total gross profit for the current period and compares it to the previous period to highlight changes in profitability over time.

query:
  fields:
    e406fb1d6f5c472687b65b28eac4a4cb: metric/gross_profit
    e406fb1d6f5c472687b65b28eac4a4cb_previous_period:
      title: Previous period
      type: PREVIOUS_PERIOD
      date_filter: date
      using: e406fb1d6f5c472687b65b28eac4a4cb

  filter_by:
    date_quarter:
      type: date_filter
      granularity: QUARTER
      from: -1
      to: -1
      using: date

metrics:
  - e406fb1d6f5c472687b65b28eac4a4cb
  - e406fb1d6f5c472687b65b28eac4a4cb_previous_period

config:
  indicator_arrow: true
  label_conditional: true
