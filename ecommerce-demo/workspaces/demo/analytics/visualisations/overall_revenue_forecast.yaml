type: line_chart
id: overall_revenue_forecast

title: Overall Revenue Forecast
description: Line chart of daily net sales over time with a 7-day forecast extension. Shows historical net sales trend and projected values for the next week. Supports revenue forecasting, net sales trend and projection analysis, and short-term sales projection for planning.

query:
  fields:
    0282c89727d946a5894408ff0ec5d08a: metric/net_sales
    201cb9fad4504784abd75c9e60198a3f: label/date.day

metrics:
  - 0282c89727d946a5894408ff0ec5d08a

view_by:
  - 201cb9fad4504784abd75c9e60198a3f

config:
  forecast_enabled: true
  forecast_confidence: 0.7
  forecast_period: 7
