type: pie_chart
id: net_sales_by_product_category

title: Net Sales by Product Category
description: Breaks down net sales by category as a percentage of total sales.

query:
  fields:
    100691d163aa4d53be0fc7e1a048190b:
      compute_ratio: true
      using: metric/net_sales
    e9a530f404de422a960d646baa0a5a7f: label/product_category

metrics:
  - field: 100691d163aa4d53be0fc7e1a048190b
    format: "#,##0.00%"

view_by:
  - e9a530f404de422a960d646baa0a5a7f

config:
  data_labels: true
  legend_position: top
